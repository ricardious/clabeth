<svg xmlns="http://www.w3.org/2000/svg" width="384" height="384" viewBox="0 0 384 384">
  <filter id="paper" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".38 .62" numOctaves="4" seed="27" stitchTiles="stitch" result="noise"/>
    <feColorMatrix in="noise" type="matrix" values="
      0 0 0 0 .34
      0 0 0 0 .29
      0 0 0 0 .22
      0 0 0 .18 -.045"/>
  </filter>
  <!-- Si un navegador no soporta el filtro, la capa queda transparente. -->
  <rect width="100%" height="100%" fill="transparent" filter="url(#paper)"/>
</svg>
